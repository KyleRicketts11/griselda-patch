<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>griselda's a2ui screen</title>
<style>
  body { background:#17111f; color:#e8e0f0; font-family:monospace; padding:16px; margin:0; }
  h3 { color:#b98bff; margin-top:0; }
  #status { color:#8f8aa0; font-size:12px; white-space:pre-wrap; margin-bottom:8px; }
</style>
</head>
<body>
<h3>griselda's a2ui screen</h3>
<div id="status">bridge armed, waiting for griselda to draw</div>
<div id="host"></div>
<script type="module">
window.addEventListener('error', function(e) {
  document.getElementById('status').textContent = 'JS ERROR: ' + (e.message || e.type);
});
import {MessageProcessor} from 'https://esm.sh/@a2ui/web_core';
import {basicCatalog} from 'https://esm.sh/@a2ui/web_core/catalogs/basic/v1';
import 'https://esm.sh/@a2ui/lit';

const statusEl = document.getElementById('status');
const host = document.getElementById('host');
const proc = new MessageProcessor([basicCatalog]);
const surfaces = {};
const deleted = {};
let seen = parseInt(localStorage.getItem('a2ui_seen') || '0', 10);
let strokes = 0;

proc.onSurfaceCreated(function(s) {
  surfaces[s.id] = s;
  delete deleted[s.id];
});

async function poll() {
  try {
    const r = await fetch('messages.log', {cache: 'no-store'});
    if (!r.ok) throw new Error('no log yet');
    const lines = (await r.text()).split('\n').filter(function(x) { return x.trim(); });
    if (lines.length < seen) { seen = 0; }
    for (let i = seen; i < lines.length; i++) {
      const msg = JSON.parse(lines[i]);
      if (msg.deleteSurface) { deleted[msg.deleteSurface.surfaceId] = true; }
      if (msg.createSurface) { delete deleted[msg.createSurface.surfaceId]; }
      proc.processMessages([msg]);
      strokes = i + 1;
    }
    seen = lines.length;
    localStorage.setItem('a2ui_seen', String(seen));
    statusEl.textContent = strokes ? ('live: ' + seen + ' strokes on file') : 'bridge armed, waiting for griselda to draw';
  } catch (e) {
    statusEl.textContent = 'waiting for the first draw...';
  }
}

function draw() {
  for (const id in surfaces) {
    if (deleted[id]) continue;
    let el = host.querySelector('[data-sid="' + id + '"]');
    if (!el) {
      el = document.createElement('a2ui-surface');
      el.setAttribute('data-sid', id);
      host.appendChild(el);
    }
    el.surface = surfaces[id];
  }
}
poll();
setInterval(poll, 3000);
setInterval(draw, 800);
</script>
</body>
</html>
